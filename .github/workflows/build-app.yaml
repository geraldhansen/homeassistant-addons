name: Build App

on:
  workflow_call:
    inputs:
      app:
        description: "Add-on directory name"
        required: true
        type: string
      publish:
        description: "Push the built image to the registry"
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare ${{ inputs.app }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      # info@master may output version with surrounding YAML quotes ("1.0.1").
      # Read it directly via yq to guarantee a clean scalar value.
      - name: Read version from config.yaml
        id: config
        run: |
          version=$(yq '.version' "./${{ inputs.app }}/config.yaml")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          # image-name is the slug without arch; the action prepends "{arch}-"
          # and wraps with ghcr.io/{owner}/ to produce the per-arch image reference.
          image-name: ${{ inputs.app }}

  build:
    name: Build ${{ matrix.arch }} — ${{ inputs.app }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Read BUILD_FROM from build.yaml
        id: build_from
        run: |
          if [[ -f "./${{ inputs.app }}/build.yaml" ]]; then
            value=$(yq ".build_from.${{ matrix.arch }}" \
              "./${{ inputs.app }}/build.yaml")
            [[ "$value" == "null" ]] && value=""
            echo "value=${value}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build add-on image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./${{ inputs.app }}
          image: ${{ matrix.image }}
          version: ${{ needs.prepare.outputs.version }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          build-args: BUILD_FROM=${{ steps.build_from.outputs.value }}
          labels: io.hass.type=addon
          push: ${{ inputs.publish }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    name: Publish manifest — ${{ inputs.app }}
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          image-name: ${{ inputs.app }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

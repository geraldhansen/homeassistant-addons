name: Builder

env:
  MONITORED_FILES: "build.yaml config.yaml Dockerfile rootfs"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_addons: ${{ steps.filter.outputs.changed_addons }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed add-ons
        id: filter
        run: |
          declare -a changed_addons
          all_changed="${{ steps.changed_files.outputs.all_changed_files }}"

          # If the workflow files themselves changed, rebuild every add-on
          if echo "$all_changed" | grep -qE '\.github/workflows/(builder|build-app)\.yaml'; then
            for addon in ${{ steps.addons.outputs.addons }}; do
              changed_addons+=("$addon")
            done
          else
            for addon in ${{ steps.addons.outputs.addons }}; do
              for file in ${{ env.MONITORED_FILES }}; do
                if echo "$all_changed" | grep -qE "(^| )${addon}/${file}"; then
                  changed_addons+=("$addon")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_addons[@]} -gt 0 ]]; then
            echo "Changed add-ons: ${changed_addons[*]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_addons=$(jq -nc '$ARGS.positional' --args "${changed_addons[@]}")" \
              >> "$GITHUB_OUTPUT"
          else
            echo "No monitored files changed (${{ env.MONITORED_FILES }})"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.addon }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.init.outputs.changed_addons) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.addon }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
